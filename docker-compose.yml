version: "3.8"

services:
  hivemind-twitch-bridge:
    build: .
    image: hivemind-twitch-bridge
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp
    volumes:
      # HiveMind identity and Noise key; keep it so the hub keeps recognising the bridge
      - hivemind-identity:/home/bridge/.config/hivemind
    environment:
      # Do NOT commit real values here; set them in a .env file or the
      # deployment's secret store.
      TWITCH_BOT_LOGIN: "${TWITCH_BOT_LOGIN}"
      TWITCH_ALLOWED_CHANNELS: "${TWITCH_ALLOWED_CHANNELS}"
      # refreshed token (a Twitch application's client id/secret + the bot's refresh token)
      TWITCH_CLIENT_ID: "${TWITCH_CLIENT_ID}"
      TWITCH_CLIENT_SECRET: "${TWITCH_CLIENT_SECRET}"
      TWITCH_REFRESH_TOKEN: "${TWITCH_REFRESH_TOKEN}"
      # or, for a short test, a plain access token instead of the three above:
      # TWITCH_OAUTH_TOKEN: "${TWITCH_OAUTH_TOKEN}"
      # HiveMind hub credentials, see `hivemind-core add-client`.
      HIVEMIND_ACCESS_KEY: "${HIVEMIND_ACCESS_KEY}"
      HIVEMIND_PASSWORD: "${HIVEMIND_PASSWORD}"
      HIVEMIND_HOST: "${HIVEMIND_HOST:-ws://hivemind-core}"
      HIVEMIND_PORT: "${HIVEMIND_PORT:-5678}"
      HIVEMIND_SITE_ID: "${HIVEMIND_SITE_ID:-twitch}"
      HIVEMIND_LANG: "${HIVEMIND_LANG:-en-us}"
      BRIDGE_HEALTH_PORT: "8080"
    # if hivemind-core runs as another compose service, uncomment:
    # depends_on:
    #   - hivemind-core

volumes:
  hivemind-identity:
